<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop | Graffiti Cans Store</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header class="site-header" id="hdr"></header>
<main class="container stub">
<h1>Shop</h1><p class="lead">Spray paint, paint markers, caps, dan ink untuk street art.</p>
<div class="chips" id="chips"></div><div class="grid3" id="grid"></div></main>
<div id="foot"></div>
<script src="app.js"></script>
<script>
const m=guard();document.getElementById('foot').innerHTML=FOOT;
let cat=-1,q='';const cart=()=>+LS.getItem('gc_cart_'+m.user)||0;
function draw(){
 document.getElementById('chips').innerHTML=['Semua',...CATS].map((c,i)=>`<button class="chip${cat===i-1?' on':''}" onclick="cat=${i-1};draw()">${c}</button>`).join('')
  +`<input class="search" placeholder="Cari produk..." value="${q}" oninput="q=this.value;list()">`;
 list();const i=document.querySelector('.search');}
function list(){
 const r=PRODUCTS.filter(p=>(cat<0||p.c===cat)&&p.n.toLowerCase().includes(q.toLowerCase()));
 document.getElementById('grid').innerHTML=r.map(p=>{const f=p.p*(100-p.d)/100;
  return `<div class="card"><span class="mute" style="font-size:12px">${CATS[p.c]}</span><h3>${p.n}</h3>
  <div class="price">${rp(f)}${p.d?`<span class="old">${rp(p.p)}</span>`:''}</div>
  <div>${p.s===0?'<span class="pill bad">Habis</span>':p.s<=LOW[p.c]?'<span class="pill">Stok menipis</span>':'<span class="pill ok">Tersedia</span>'}
  <span class="hint" style="margin-left:6px">${p.t} terjual</span></div>
  <button class="btn btn-small" style="margin-top:8px" ${p.s===0?'disabled':''} onclick="add(this)">+ Keranjang</button></div>`}).join('')||'<p class="mute">Produk tidak ditemukan.</p>'}
function add(b){LS.setItem('gc_cart_'+m.user,cart()+1);b.textContent='Ditambahkan ✓ ('+cart()+' item)'}
draw();
</script></body></html>
